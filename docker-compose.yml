services:
  # Runs the component like production (prod-only deps) against ./data, with live code mounted.
  dev:
    build:
      context: .
      target: production
    volumes:
        - ./:/code
        - ./data:/data
    environment:
      - KBC_DATADIR=./data
  # Uses the `test` stage (all dependency groups installed), so ruff + pytest are available.
  test:
    build:
      context: .
      target: test
    volumes:
      - ./:/code
      - ./data:/data
    environment:
      - KBC_DATADIR=./data
    command:
      - /bin/sh
      - /code/scripts/build_n_test.sh
